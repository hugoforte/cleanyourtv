plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hugoforte.youtubechannel'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.hugoforte.youtubechannel'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The channel's name, ID, card and picture, written by build-and-install.ps1 / .sh.
    sourceSets {
        main.res.srcDirs += 'src/channel/res'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the page parsing, src/test.
    testImplementation 'junit:junit:4.13.2'
}
